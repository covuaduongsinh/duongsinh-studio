# Hardening of the runner service itself (plan T, T8). Install, as the runner's user, as
#   ~/.config/systemd/user/nocobase-runner.service.d/hardening.conf
# then `systemctl --user daemon-reload && systemctl --user restart nocobase-runner`.
# Roll back by deleting the file and doing the same. Try it with ONE run first: a path a tool needs and this does not
# list shows as "Read-only file system" in the run's log.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
# The system directories become read-only for the runner; its own home (work directories, tool caches, logins) stays writable.
ProtectSystem=strict
ReadWritePaths=%h
# Nothing a run does needs the kernel's tunables, the clock or other users' processes.
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
