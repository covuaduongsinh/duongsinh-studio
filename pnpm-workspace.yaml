# Which dependencies may run install scripts: true compiles a native addon, false skips a script
# the project does not need. A package left out here stops the install with ERR_PNPM_IGNORED_BUILDS.
# pnpm 11 reads this from pnpm-workspace.yaml only; see https://pnpm.io/settings/build.
allowBuilds:
  better-sqlite3: false
  esbuild: true
  oracledb: true
  tesseract.js: false
  '@mongodb-js/zstd': false
  node-liblzma: false

# The application stays at the workspace root; reusable internal packages live below packages/.
packages: ['packages/*']

# Use msgpackr without its optional native accelerator or platform binary packages.
ignoredOptionalDependencies: [msgpackr-extract]

# Install dependencies explicitly instead of during dev/build/start.
# create-app installs them initially; run pnpm install after changing dependencies.
verifyDepsBeforeRun: false

# Skips re-auditing lockfile entries against the supply-chain policy on every install.
# The check costs tens of seconds here and re-verifies versions the lockfile already pins;
# newly resolved packages are still checked. Set to false if outside contributors edit the
# lockfile. See https://pnpm.io/settings/dependency-resolution#trustlockfile.
trustLockfile: true

# Reports a dependency whose install script was skipped as a warning instead of failing the
# install. allowBuilds above decides the packages known today; this keeps a new transitive
# dependency from stopping the install with a red error before anything is even running.
# See https://pnpm.io/settings/build#strictdepbuilds.
strictDepBuilds: false

# Dương Sinh: the dev machine (Intel Pentium Gold G6405) has no AVX/AVX2, and the native
# @rollup/rollup-linux-x64-gnu binary dies with SIGILL there, killing Vite. The WebAssembly
# build has the same API and runs on any x86-64 CPU. Keep it until every machine that installs
# this app (dev PC, VPS runner, CI) is known to support AVX2. See docs/moi-truong-dev.md.
overrides:
  rollup: npm:@rollup/wasm-node@^4.67.3

minimumReleaseAgeExclude:
  - '@nocobase/app-cli@1.0.0-beta.31'
  - '@nocobase/app-host@0.1.0-beta.18'
  - '@nocobase/app-plugin-agent-sessions@1.0.0-beta.15'
  - '@nocobase/app-plugin-agents@2.0.0-beta.1'
  - '@nocobase/app-plugin-api-keys@1.0.0-beta.20'
  - '@nocobase/app-plugin-authentication@2.0.0-beta.17'
  - '@nocobase/app-plugin-authorization@1.0.0-beta.34'
  - '@nocobase/app-plugin-authz-default-access@1.0.0-beta.18'
  - '@nocobase/app-plugin-authz-restriction-rules@1.0.0-beta.16'
  - '@nocobase/app-plugin-authz-sharing-rules@1.0.0-beta.17'
  - '@nocobase/app-plugin-concurrency@0.1.0-beta.1'
  - '@nocobase/app-plugin-database-explorer@1.0.0-beta.18'
  - '@nocobase/app-plugin-file@1.0.0-beta.28'
  - '@nocobase/app-plugin-foundation@0.1.0-beta.11'
  - '@nocobase/app-plugin-i18n@1.0.0-beta.19'
  - '@nocobase/app-plugin-knowledge@0.1.0-beta.16'
  - '@nocobase/app-plugin-mail@1.0.0-beta.19'
  - '@nocobase/app-plugin-notification-in-app@2.0.0-beta.1'
  - '@nocobase/app-plugin-notification-providers@1.0.0-beta.17'
  - '@nocobase/app-plugin-notification@2.0.0-beta.3'
  - '@nocobase/app-plugin-projects@0.1.0-beta.23'
  - '@nocobase/app-plugin-releases@0.1.0-beta.16'
  - '@nocobase/app-plugin-scheduler@1.0.0-beta.22'
  - '@nocobase/app-plugin-users@2.0.0-beta.12'
  - '@nocobase/app-server@4.0.0-beta.0'
  - '@nocobase/app-skills@0.1.0-beta.56'
  - '@nocobase/app-testing@0.1.0-beta.7'
  - '@nocobase/authorization@1.0.0-beta.16'
  - '@nocobase/concurrency@0.1.0-beta.1'
  - '@nocobase/realtime@1.0.0-beta.0'
  - '@rollup/wasm-node@4.67.3'
  - cron-parser@5.10.3
  - electron-to-chromium@1.5.472
  - i18next@26.6.0
  - kysely@0.29.8
  - node-releases@2.0.63
  - prosemirror-view@1.42.9
  - react-resizable-panels@4.16.0
  - ws@8.22.1

# Dương Sinh: vite build of the client outgrew Node default ~2 GB heap ("JavaScript heap out of memory", SIGABRT),
# with Rollup as WebAssembly on the non-AVX dev CPU. pnpm passes this to every script through NODE_OPTIONS.
nodeOptions: --max-old-space-size=4096
